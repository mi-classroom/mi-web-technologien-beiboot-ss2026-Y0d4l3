<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Live Pose Raw Data</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      display: flex;
      font-family: monospace;
      background-color: #1e1e1e;
      color: #d4d4d4;
      margin: 0;
      padding: 20px;
    }

    .video-container {
      position: relative;
      margin-right: 20px;
    }

    video {
      display: none;
    }

    canvas {
      border: 2px solid #007acc;
      border-radius: 8px;
      background-color: #000;
    }

    #rawData {
      width: 500px;
      height: 480px;
      overflow-y: auto;
      background: #2d2d2d;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 12px;
      border: 1px solid #444;
    }

    h2 {
      margin-top: 0;
      color: #9cdcfe;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <video id="input_video" width="640" height="480" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <div>
    <h2>Rohdaten (Landmark 0: Nase)</h2>
    <div id="rawData">Warte auf Kamera...</div>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const rawDataBox = document.getElementById('rawData');

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

        const nose = results.poseLandmarks[0];
        const rawDataString = JSON.stringify({
          timestamp: new Date().toISOString(),
          landmark: "Nase",
          data: {
            x: nose.x.toFixed(4),
            y: nose.y.toFixed(4),
            z: nose.z.toFixed(4),
            visibility: nose.visibility.toFixed(4)
          }
        }, null, 2);

        rawDataBox.textContent = rawDataString + "\n\n(Es kommen 33 solcher Landmarks pro Frame rein!)";
      } else {
        rawDataBox.textContent = "Keine Person erkannt.";
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
      }
    });

    pose.setOptions({
      modelComplexity: 1, // 0=schnell, 1=ausgewogen, 2=genau
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {await pose.send({image: videoElement});},
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>

</html>
